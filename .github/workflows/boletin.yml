name: Boletin Macro Unvesting diario

on:
  # Envio automatico diario reactivado (pedido explicito del usuario
  # 2026-11-02). Minuto 7 en vez de en punto -- GitHub documenta que los
  # cron en punto (minuto 0) sufren mas congestion/retraso en todo el
  # mundo; ya se confirmo este problema una vez en este mismo repo
  # (iteracion 2026-10-30) y se resolvio moviendo el minuto.
  schedule:
    - cron: "7 12 * * *"
  workflow_dispatch: {}

jobs:
  enviar-boletin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Generar y enviar boletin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Subir imagenes generadas (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boletin-macro-${{ github.run_id }}
          path: |
            render_out/*.png
            render_out/*.pdf
            data_dump.json
          retention-days: 7
          if-no-files-found: ignore

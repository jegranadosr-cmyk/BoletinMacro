name: Boletin Macro Unvesting diario

on:
  schedule:
    # ~7:00 am America/Bogota (UTC-5) = ~12:00 UTC, every day. Minute offset
    # (7, not 0) is deliberate -- GitHub's own docs warn that top-of-the-hour
    # cron triggers queue behind a huge global spike and can be delayed by
    # hours or skipped outright; a non-zero minute avoids most of that queue.
    - cron: "7 12 * * *"
  workflow_dispatch: {}

jobs:
  enviar-boletin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Generar y enviar boletin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Subir imagenes generadas (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boletin-macro-${{ github.run_id }}
          path: |
            render_out/*.png
            render_out/*.pdf
            data_dump.json
          retention-days: 7
          if-no-files-found: ignore

name: Boletin Macro Unvesting diario

on:
  # Envio automatico diario desactivado: este boletin (diseno "Siete
  # Magnificas") duplicaba el envio por Telegram del boletin "Lupa al
  # mercado" del otro repo. Se deja workflow_dispatch para poder correrlo
  # a mano si hace falta.
  workflow_dispatch: {}

jobs:
  enviar-boletin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Generar y enviar boletin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Subir imagenes generadas (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boletin-macro-${{ github.run_id }}
          path: |
            render_out/*.png
            render_out/*.pdf
            data_dump.json
          retention-days: 7
          if-no-files-found: ignore
